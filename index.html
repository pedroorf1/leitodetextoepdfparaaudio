<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>🔊 Leitor de Texto e PDF</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --accent: #3b82f6;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      align-items: center;
    }

    .container {
      background: var(--card);
      padding: 2rem;
      border-radius: var(--radius);
      width: 100%;
      max-width: 800px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #93c5fd;
    }

    .custom-file-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: #334155;
      color: white;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 10px;
      font-weight: 600;
      border: 2px dashed #475569;
    }

    #pdfInput {
      display: none;
    }

    textarea {
      width: 100%;
      height: 200px;
      background: #0f172a;
      color: white;
      padding: 12px;
      border: 2px solid #334155;
      border-radius: 8px;
      margin-bottom: 1rem;
      resize: vertical;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      background: #0f172a;
      color: white;
      border: 2px solid #334155;
      margin-bottom: 1rem;
    }

    button {
      padding: 12px;
      flex: 1;
      min-width: 150px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      font-weight: 600;
      background: var(--accent);
    }

    #skipBtn {
      background: #8b5cf6;
    }

    #pauseBtn {
      background: #64748b;
    }

    #stopBtn {
      background: #ef4444;
    }

    .status {
      padding: 12px;
      background: #0f172a;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #334155;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🔊 Leitor de Texto e PDF</h1>

    <label for="pdfInput" class="custom-file-btn">📁 Selecionar arquivo PDF</label>
    <input type="file" id="pdfInput" accept="application/pdf">
    <div id="fileNameDisplay" style="text-align: center; margin-bottom: 10px; font-size: 0.8rem; color: #94a3b8;">Nenhum
      arquivo selecionado</div>

    <textarea id="textInput" placeholder="Cole seu texto aqui ou carregue um PDF..."></textarea>

    <select id="voiceSelect"></select>

    <div class="controls">
      <button id="playBtn">▶️ Reproduzir do Cursor</button>
      <button id="skipBtn">⏭️ Pular Parágrafo</button>
      <button id="pauseBtn">⏸️ Pausar</button>
      <button id="stopBtn">⏹️ Parar</button>
    </div>
    <div id="status" class="status">Pronto</div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
    const textInput = document.getElementById('textInput');
    const pdfInput = document.getElementById('pdfInput');
    const statusEl = document.getElementById('status');
    const voiceSelect = document.getElementById('voiceSelect');

    // Função para mover o cursor visualmente
    function updateCursor(pos) {
      textInput.focus();
      textInput.setSelectionRange(pos, pos);
    }

    function playFromPosition(startPos) {
      speechSynthesis.cancel();
      const textToSpeak = textInput.value.substring(startPos);

      if (textToSpeak.trim() === "") {
        statusEl.textContent = "❌ Fim do texto!";
        return;
      }

      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.voice = speechSynthesis.getVoices()[voiceSelect.value];
      utterance.onstart = () => statusEl.textContent = "🔊 Reproduzindo...";
      window.speechSynthesis.speak(utterance);
    }

    document.getElementById('skipBtn').addEventListener('click', () => {
      const currentPos = textInput.selectionStart;
      const remainingText = textInput.value.substring(currentPos);
      const nextLineIndex = remainingText.indexOf('\n');

      if (nextLineIndex !== -1) {
        // Pula para o início da próxima linha (+1 para pular o caractere de quebra de linha)
        const newPos = currentPos + nextLineIndex + 1;

        // Atualiza o cursor no textarea visualmente
        updateCursor(newPos);

        // Inicia a fala
        playFromPosition(newPos);
        statusEl.textContent = "⏭️ Pulou para o próximo parágrafo";
      } else {
        statusEl.textContent = "⚠️ Fim do documento.";
      }
    });

    document.getElementById('playBtn').addEventListener('click', () => playFromPosition(textInput.selectionStart));

    // ... (restante das funções de PDF e Voz permanecem iguais)
    pdfInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      document.getElementById('fileNameDisplay').textContent = "Arquivo: " + file.name;
      const reader = new FileReader();
      reader.onload = async () => {
        const pdf = await pdfjsLib.getDocument(new Uint8Array(reader.result)).promise;
        let fullText = "";
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          fullText += content.items.map(item => item.str).join(" ") + "\n";
        }
        textInput.value = fullText;
      };
      reader.readAsArrayBuffer(file);
    });

    function loadVoices() {
      const voices = speechSynthesis.getVoices();
      voiceSelect.innerHTML = voices.map((v, i) => `<option value="${i}">${v.name}</option>`).join('');
    }
    speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    document.getElementById('pauseBtn').addEventListener('click', () => {
      if (speechSynthesis.paused) speechSynthesis.resume(); else speechSynthesis.pause();
    });
    document.getElementById('stopBtn').addEventListener('click', () => {
      speechSynthesis.cancel();
      statusEl.textContent = "⏹️ Parado";
    });
  </script>
</body>

</html>
