<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>🔊 Leitor de Texto e PDF</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --accent: #3b82f6;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
    }

    .container {
      background: var(--card);
      padding: 2rem;
      border-radius: var(--radius);
      width: 100%;
      max-width: 800px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #93c5fd;
    }

    /* Estilo do Botão Customizado */
    .custom-file-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: #334155;
      color: white;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 10px;
      font-weight: 600;
      border: 2px dashed #475569;
    }

    .custom-file-btn:hover {
      background: #475569;
    }

    #pdfInput {
      display: none;
    }

    /* Esconde o input real */

    textarea {
      width: 100%;
      height: 150px;
      background: #0f172a;
      color: white;
      padding: 12px;
      border: 2px solid #334155;
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 1rem;
    }

    select {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      background: #0f172a;
      color: white;
      border: 2px solid #334155;
    }

    button {
      padding: 12px;
      flex: 1;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      font-weight: 600;
      background: var(--accent);
    }

    #pauseBtn {
      background: #64748b;
    }

    #stopBtn {
      background: #ef4444;
    }

    .status {
      padding: 12px;
      background: #0f172a;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #334155;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🔊 Leitor de Texto e PDF</h1>

    <label for="pdfInput" class="custom-file-btn">📁 Selecionar arquivo PDF</label>
    <input type="file" id="pdfInput" accept="application/pdf">
    <div id="fileNameDisplay" style="text-align: center; margin-bottom: 10px; font-size: 0.8rem; color: #94a3b8;">Nenhum
      arquivo selecionado</div>

    <textarea id="textInput" placeholder="Cole seu texto aqui ou carregue um PDF..."></textarea>

    <select id="voiceSelect"></select>

    <div class="controls">
      <button id="playBtn">▶️ Reproduzir</button>
      <button id="pauseBtn">⏸️ Pausar</button>
      <button id="stopBtn">⏹️ Parar</button>
    </div>
    <div id="status" class="status">Pronto</div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
    const pdfInput = document.getElementById('pdfInput');
    const textInput = document.getElementById('textInput');
    const statusEl = document.getElementById('status');
    const fileNameDisplay = document.getElementById('fileNameDisplay');

    // Ao selecionar arquivo, dispara o carregamento
    pdfInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      fileNameDisplay.textContent = "Arquivo: " + file.name;
      statusEl.textContent = "⏳ Lendo PDF...";

      const reader = new FileReader();
      reader.onload = async () => {
        const pdf = await pdfjsLib.getDocument(new Uint8Array(reader.result)).promise;
        let fullText = "";
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          fullText += content.items.map(item => item.str).join(" ") + "\n";
        }
        textInput.value = fullText;
        statusEl.textContent = "✅ Pronto!";
      };
      reader.readAsArrayBuffer(file);
    });

    // Funções de fala (mantidas conforme anterior)
    function loadVoices() {
      const voices = speechSynthesis.getVoices();
      document.getElementById('voiceSelect').innerHTML = voices.map((v, i) => `<option value="${i}">${v.name}</option>`).join('');
    }
    speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    document.getElementById('playBtn').addEventListener('click', () => {
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(textInput.value);
      utterance.voice = speechSynthesis.getVoices()[document.getElementById('voiceSelect').value];
      window.speechSynthesis.speak(utterance);
      statusEl.textContent = "🔊 Reproduzindo...";
    });

    document.getElementById('pauseBtn').addEventListener('click', () => {
      if (speechSynthesis.paused) speechSynthesis.resume(); else speechSynthesis.pause();
    });

    document.getElementById('stopBtn').addEventListener('click', () => {
      speechSynthesis.cancel();
      statusEl.textContent = "⏹️ Parado";
    });
  </script>
</body>

</html>
